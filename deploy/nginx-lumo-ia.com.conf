# =============================================================
#  Lumo — configuração do nginx para lumo-ia.com
#  Site estático (HTML/CSS/JS), sem backend.
#
#  Instalação no VPS:
#    cp /var/www/lumo-ia.com/deploy/nginx-lumo-ia.com.conf \
#       /etc/nginx/sites-available/lumo-ia.com
#    ln -s /etc/nginx/sites-available/lumo-ia.com /etc/nginx/sites-enabled/
#    rm -f /etc/nginx/sites-enabled/default
#    nginx -t && systemctl reload nginx
#
#  O HTTPS é adicionado automaticamente depois, pelo certbot.
# =============================================================

server {
    listen 80;
    listen [::]:80;
    server_name lumo-ia.com www.lumo-ia.com;

    root /var/www/lumo-ia.com;
    index index.html;

    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    # ---- Compressão (o site tem bastante imagem e CSS) ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ---- Cache longo para estáticos ----
    location ~* \.(png|jpe?g|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # CSS e JS: cache menor, porque mudam a cada atualização do site
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- Segurança básica ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Bloqueia acesso a arquivos internos do repositório
    location ~ /\.(git|gitignore|gitattributes) {
        deny all;
        return 404;
    }
    location ^~ /deploy/ {
        deny all;
        return 404;
    }
}
